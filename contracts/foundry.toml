[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = true
# The urn test draws all 10,000 slots of a series in one call, past the 2^30 default.
gas_limit = "max"
fs_permissions = [{ access = "read", path = "./test/fixtures" }]
remappings = ["@openzeppelin/=lib/openzeppelin-contracts/"]

[rpc_endpoints]
base = "https://mainnet.base.org"
base_sepolia = "https://sepolia.base.org"
